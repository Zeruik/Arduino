[platformio]
src_dir = XiaobaiBot
default_envs = n16r8
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:prepare.py
build_flags = -DBOARD_HAS_PSRAM -DFENG_KV_Q2=1 -DFENG_KV_Q2_BLOCK=8 -DFENG_MAX_SCORES=2048 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu17
[env:n16r8]
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_n16.csv
build_flags = ${env.build_flags} -DXB_CTX=512 -DXB_PROFILE=16
[env:n32r16]
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_build.flash_size = 32MB
board_build.partitions = partitions_n32.csv
build_flags = ${env.build_flags} -DXB_CTX=2048 -DXB_PROFILE=32
