<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小白Bot · Xiaobai Bot</title>
<style>:root{font-family:system-ui,sans-serif;color:#e7edf6;background:#10151f}body{margin:0}main{max-width:840px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:26px;margin:0}small,p{color:#aab8ca}#status{font-size:12px;border:1px solid #40516a;border-radius:20px;padding:8px}#messages{min-height:48vh;padding:20px 0}.msg{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c2636;border-radius:14px;padding:16px;margin:12px 0;line-height:1.7}.user{background:#273a52;margin-left:36px}.meta{font-size:12px;color:#96c4eb}form{display:flex;gap:10px}textarea{resize:vertical;flex:1;min-width:0;min-height:64px;border:1px solid #40516a;border-radius:12px;padding:12px;color:inherit;background:#182231;font:inherit}button{border:0;border-radius:12px;padding:12px 18px;background:#b9ddf5;color:#142333;cursor:pointer}button:disabled{opacity:.45}#reset{background:#233146;color:#c7d7e7;padding:8px 12px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{font-size:12px;background:#233146;color:#bfd0e7}footer{font-size:12px;color:#8294ad;line-height:1.8;margin-top:16px}a{color:#b9ddf5}</style>
<main><header><div><h1>小白Bot <span style="font-weight:400;font-size:16px">Xiaobai Bot</span></h1><p>把一点好奇心，装进一块芯片。</p></div><span id="status">正在读取运行状态</span></header>
<div class="chips"><button type="button" data-q="你是谁">认识小白</button><button type="button" data-q="月亮自己发光吗">自然科学</button><button type="button" data-q="LED为什么要限流">电路基础</button><button type="button" id="reset">清空对话</button></div>
<section id="messages" aria-live="polite"><div class="msg">你好，我是小白。你可以问我基础科学、地理、电路，也可以随便聊聊。<br><span class="meta">模型很小，回答可能有误；当前回答来自实际加载的模型。</span></div></section>
<form id="form"><textarea id="q" maxlength="160" aria-label="输入消息" placeholder="向小白提问…（短问题效果更好）" required></textarea><button id="send">发送</button></form>
<footer>理工阿白菌 / TechABJ · 中文本地极轻量语言模型<br>开发验证页会明确标注“电脑验证”；连接芯片热点后标注“ESP32-S3 板端”。模型基于 feng-30m 开源底座继续训练，Apache-2.0。网页无需第三方脚本或 CDN。</footer></main>
<script>
const $=s=>document.querySelector(s);let busy=false;
function msg(text,cls=''){const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;$('#messages').append(el);el.scrollIntoView({behavior:'smooth',block:'nearest'});return el}
async function status(){try{let r=await fetch('/api/status');if(!r.ok)throw Error();let s=await r.json();$('#status').textContent=s.mode+' · '+s.profile;return s}catch{$('#status').textContent='服务未连接';return null}}status();
async function send(q){if(busy||!q.trim())return;busy=true;$('#send').disabled=true;$('#reset').disabled=true;msg(q,'user');const el=msg('小白正在本地思考…');$('#q').value='';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:q});if(r.status!==202)throw Error(await r.text());let id=await r.text();for(;;){await new Promise(ok=>setTimeout(ok,600));let a=await fetch('/api/result?id='+encodeURIComponent(id));if(a.status===202)continue;if(!a.ok)throw Error(await a.text());el.textContent=(await a.text())||'这次没有生成有效文字，请换一种问法。';break}}catch(e){el.textContent='未完成：'+e.message}finally{busy=false;$('#send').disabled=false;$('#reset').disabled=false;status()}}
$('#form').onsubmit=e=>{e.preventDefault();send($('#q').value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));
$('#reset').onclick=async()=>{if(busy)return;let r=await fetch('/api/reset',{method:'POST'});if(r.ok){$('#messages').replaceChildren();msg('已清空上下文。')}else msg('清空失败，请稍后重试。')};
$('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send($('#q').value)}};
</script></html>
